
services:
  registry:
    image: goharbor/registry-photon:v2.14.0
    restart: always
    volumes:
      - /data/registry:/storage
      - ./common/config/registry/:/etc/registry/
    ports:
      - 5000:5000
    command:
      ["serve", "/etc/registry/config.yml"]
  postgres:
    image: goharbor/harbor-db:v2.14.0
    restart: always
    privileged: true
    volumes:
      - /data/database:/var/lib/postgresql/data:z
    env_file:
      - ./common/config/db/env
    ports:
      - 5432:5432
  redis:
    image: goharbor/redis-photon:v2.14.0
    restart: always
    volumes:
      - /data/redis:/data
    ports:
      - 6379:6379
  ldap_server:
    image: firstfloor/openldap:1.1.7
    restart: always
    env_file:
      - ./common/config/ldap/env
    ports:
      - 389:389
      - 636:636


     